<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Metallic & Tactical Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181F" />
      <stop offset="60%" stop-color="#0B0E12" />
      <stop offset="100%" stop-color="#06080A" />
    </linearGradient>

    <!-- Chrome & Reflective Silver -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="48%" stop-color="#94A3B8" />
      <stop offset="52%" stop-color="#475569" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="silverBright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- High-Visibility Safety Orange -->
    <linearGradient id="hiVisOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="35%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D94800" />
    </linearGradient>

    <!-- Amber Cab Marker Lights -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <!-- Truck Windshield Glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="truckShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF6B00" flood-opacity="0.5" />
    </filter>
    <filter id="amberLightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Badge Canvas -->
  <rect width="512" height="512" rx="90" fill="url(#bgGrad)" stroke="#1F2633" stroke-width="2" />

  <!-- Outer Tire Tread Lug Accents (Flanking Left & Right) -->
  <g fill="#171C24" stroke="#2B3648" stroke-width="2">
    <!-- Left Aggressive Steer/Drive Tire Lugs -->
    <path d="M 32 145 L 64 158 L 64 182 L 32 170 Z" />
    <path d="M 28 195 L 60 207 L 60 231 L 28 220 Z" />
    <path d="M 26 245 L 58 253 L 58 277 L 26 270 Z" />
    <path d="M 28 295 L 60 299 L 60 323 L 28 320 Z" />
    <path d="M 34 345 L 68 343 L 68 367 L 34 370 Z" />
    <path d="M 46 395 L 82 387 L 82 411 L 46 420 Z" />

    <!-- Right Aggressive Steer/Drive Tire Lugs -->
    <path d="M 480 145 L 448 158 L 448 182 L 480 170 Z" />
    <path d="M 484 195 L 452 207 L 452 231 L 484 220 Z" />
    <path d="M 486 245 L 454 253 L 454 277 L 486 270 Z" />
    <path d="M 484 295 L 452 299 L 452 323 L 484 320 Z" />
    <path d="M 478 345 L 444 343 L 444 367 L 478 370 Z" />
    <path d="M 466 395 L 430 387 L 430 411 L 466 420 Z" />
  </g>

  <!-- Kettlebell Handle Arching Overhead (Framing the Semi-Truck Roof) -->
  <path d="M 175 140 C 175 60, 337 60, 337 140" 
        fill="none" 
        stroke="url(#chromeGrad)" 
        stroke-width="26" 
        stroke-linecap="round"
        filter="url(#truckShadow)"/>
  <!-- Handle Inner Negative Cut -->
  <path d="M 192 140 C 192 84, 320 84, 320 140" 
        fill="none" 
        stroke="#0B0E12" 
        stroke-width="8" 
        stroke-linecap="round"/>
  <!-- Diamond Knurled Grip Lines on Kettlebell Top -->
  <g stroke="#64748B" stroke-width="2.5" stroke-linecap="round">
    <line x1="228" y1="80" x2="236" y2="98" />
    <line x1="244" y1="76" x2="252" y2="95" />
    <line x1="260" y1="75" x2="260" y2="94" />
    <line x1="276" y1="76" x2="268" y2="95" />
    <line x1="292" y1="80" x2="284" y2="98" />
  </g>

  <!-- Classic Interstate Highway Shield (Outlining the Rig Foundation) -->
  <!-- Outer High-Vis Orange Shield Border -->
  <path d="M 86 142 
           C 162 114, 256 150, 256 150 
           C 256 150, 350 114, 426 142 
           C 442 258, 396 384, 256 468 
           C 116 384, 70 258, 86 142 Z" 
        fill="#0D1117" 
        stroke="url(#hiVisOrange)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#orangeGlow)"/>

  <!-- Inner Reflective Silver Bevel Rim -->
  <path d="M 104 158 
           C 172 134, 256 166, 256 166 
           C 256 166, 340 134, 408 158 
           C 420 258, 380 368, 256 444 
           C 132 368, 92 258, 104 158 Z" 
        fill="none" 
        stroke="url(#chromeGrad)" 
        stroke-width="4.5" 
        stroke-linejoin="round" 
        opacity="0.8"/>

  <!-- ============================================================== -->
  <!-- HERO AMERICAN SEMI-TRUCK (Peterbilt / Kenworth Conventional) -->
  <!-- ============================================================== -->

  <!-- TWIN VERTICAL CHROME EXHAUST STACKS (Smokestacks Behind Cab) -->
  <g filter="url(#truckShadow)">
    <!-- Left Exhaust Stack -->
    <!-- Curved 45-degree Slash Exhaust Tip -->
    <path d="M 130 90 C 130 75, 142 62, 148 58 L 158 68 C 152 74, 144 82, 144 90 Z" fill="url(#silverBright)"/>
    <!-- Stack Main Tube -->
    <rect x="132" y="88" width="12" height="150" fill="url(#chromeGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Heat Shield with Ventilation Slots -->
    <rect x="127" y="140" width="18" height="85" rx="3" fill="#1E293B" stroke="url(#chromeGrad)" stroke-width="2"/>
    <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
      <line x1="131" y1="150" x2="141" y2="150" />
      <line x1="131" y1="160" x2="141" y2="160" />
      <line x1="131" y1="170" x2="141" y2="170" />
      <line x1="131" y1="180" x2="141" y2="180" />
      <line x1="131" y1="190" x2="141" y2="190" />
      <line x1="131" y1="200" x2="141" y2="200" />
      <line x1="131" y1="210" x2="141" y2="210" />
    </g>

    <!-- Right Exhaust Stack -->
    <!-- Curved 45-degree Slash Exhaust Tip -->
    <path d="M 382 90 C 382 75, 370 62, 364 58 L 354 68 C 360 74, 368 82, 368 90 Z" fill="url(#silverBright)"/>
    <!-- Stack Main Tube -->
    <rect x="368" y="88" width="12" height="150" fill="url(#chromeGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Heat Shield with Ventilation Slots -->
    <rect x="367" y="140" width="18" height="85" rx="3" fill="#1E293B" stroke="url(#chromeGrad)" stroke-width="2"/>
    <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
      <line x1="371" y1="150" x2="381" y2="150" />
      <line x1="371" y1="160" x2="381" y2="160" />
      <line x1="371" y1="170" x2="381" y2="170" />
      <line x1="371" y1="180" x2="381" y2="180" />
      <line x1="371" y1="190" x2="381" y2="190" />
      <line x1="371" y1="200" x2="381" y2="200" />
      <line x1="371" y1="210" x2="381" y2="210" />
    </g>
  </g>

  <!-- TRUCK CAB BODY & ROOF -->
  <g filter="url(#truckShadow)">
    <!-- Cab Roof Contour -->
    <path d="M 172 170 
             C 192 145, 230 140, 256 140 
             C 282 140, 320 145, 340 170 
             L 348 230 L 164 230 Z" 
          fill="#161B23" 
          stroke="#2D3748" 
          stroke-width="3" />

    <!-- 5 AMBER CAB CLEARANCE / MARKER ROOF LIGHTS (Class 8 Truck Signature) -->
    <g filter="url(#amberLightGlow)">
      <!-- Light 1 (Far Left) -->
      <path d="M 195 158 C 195 152, 202 150, 205 152 C 208 154, 207 161, 201 161 C 197 161, 195 159, 195 158 Z" fill="url(#amberGlow)" />
      <!-- Light 2 (Mid Left) -->
      <path d="M 220 151 C 220 145, 227 143, 230 145 C 233 147, 232 154, 226 154 C 222 154, 220 152, 220 151 Z" fill="url(#amberGlow)" />
      <!-- Light 3 (Center) -->
      <path d="M 251 148 C 251 142, 258 141, 261 143 C 264 145, 263 152, 257 152 C 253 152, 251 150, 251 148 Z" fill="url(#amberGlow)" />
      <!-- Light 4 (Mid Right) -->
      <path d="M 282 151 C 282 145, 289 143, 292 145 C 295 147, 294 154, 288 154 C 284 154, 282 152, 282 151 Z" fill="url(#amberGlow)" />
      <!-- Light 5 (Far Right) -->
      <path d="M 307 158 C 307 152, 314 150, 317 152 C 320 154, 319 161, 313 161 C 309 161, 307 159, 307 158 Z" fill="url(#amberGlow)" />
    </g>

    <!-- Heavy Drop Sun Visor (Angled over windshield) -->
    <path d="M 166 178 L 256 186 L 346 178 L 348 190 L 256 199 L 164 190 Z" 
          fill="url(#silverBright)" 
          stroke="#334155" 
          stroke-width="1.5" />

    <!-- Split Windshield (Left & Right Dark Glass Panes) -->
    <!-- Left Glass -->
    <path d="M 172 194 L 250 202 L 250 230 L 170 230 Z" fill="url(#glassGrad)" stroke="#222B38" stroke-width="2"/>
    <!-- Right Glass -->
    <path d="M 262 202 L 340 194 L 342 230 L 262 230 Z" fill="url(#glassGrad)" stroke="#222B38" stroke-width="2"/>
    <!-- Center Windshield Divider Pillar -->
    <rect x="250" y="200" width="12" height="32" fill="#1A202C" />

    <!-- Windshield Wipers -->
    <line x1="178" y1="228" x2="230" y2="210" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    <line x1="270" y1="228" x2="322" y2="210" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- WEST COAST SIDE VIEW TRUCK MIRRORS (Left and Right Wings) -->
  <g stroke="url(#chromeGrad)" stroke-width="3" stroke-linecap="round">
    <!-- Left Mirror Tubular Bracket & Mirrors -->
    <line x1="162" y1="185" x2="128" y2="192" />
    <line x1="162" y1="230" x2="128" y2="230" />
    <!-- Left Flat Main Mirror -->
    <rect x="120" y="184" width="14" height="46" rx="2" fill="#0F172A" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="123" y1="188" x2="127" y2="225" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <!-- Left Convex Spot Mirror -->
    <circle cx="127" cy="242" r="7" fill="#0F172A" stroke="url(#chromeGrad)" stroke-width="2"/>

    <!-- Right Mirror Tubular Bracket & Mirrors -->
    <line x1="350" y1="185" x2="384" y2="192" />
    <line x1="350" y1="230" x2="384" y2="230" />
    <!-- Right Flat Main Mirror -->
    <rect x="378" y="184" width="14" height="46" rx="2" fill="#0F172A" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="381" y1="188" x2="385" y2="225" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <!-- Right Convex Spot Mirror -->
    <circle cx="385" cy="242" r="7" fill="#0F172A" stroke="url(#chromeGrad)" stroke-width="2"/>
  </g>

  <!-- SEMI-TRUCK HOOD, BROAD FENDERS & HEADLIGHTS -->
  <g filter="url(#truckShadow)">
    <!-- Broad Hood Crown & Sides -->
    <path d="M 160 230 L 352 230 L 372 325 L 340 335 L 172 335 L 140 325 Z" 
          fill="#12161E" 
          stroke="#2A3444" 
          stroke-width="2" />
    
    <!-- Hood Center Ridge Seam -->
    <line x1="256" y1="230" x2="256" y2="250" stroke="#FF6B00" stroke-width="4"/>

    <!-- Left Front Fender & Headlight Bucket -->
    <path d="M 140 280 Q 130 330 148 355 L 176 355 L 174 320 Z" fill="#1A222D" stroke="#334155" stroke-width="2"/>
    <!-- Left Dual Rectangular Headlights -->
    <rect x="134" y="322" width="34" height="22" rx="3" fill="#0B0F15" stroke="url(#chromeGrad)" stroke-width="2"/>
    <rect x="137" y="325" width="13" height="16" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <rect x="152" y="325" width="13" height="16" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <!-- Amber Turn Indicator -->
    <rect x="134" y="346" width="34" height="6" rx="1" fill="#F59E0B" />

    <!-- Right Front Fender & Headlight Bucket -->
    <path d="M 372 280 Q 382 330 364 355 L 336 355 L 338 320 Z" fill="#1A222D" stroke="#334155" stroke-width="2"/>
    <!-- Right Dual Rectangular Headlights -->
    <rect x="344" y="322" width="34" height="22" rx="3" fill="#0B0F15" stroke="url(#chromeGrad)" stroke-width="2"/>
    <rect x="347" y="325" width="13" height="16" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <rect x="362" y="325" width="13" height="16" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <!-- Amber Turn Indicator -->
    <rect x="344" y="346" width="34" height="6" rx="1" fill="#F59E0B" />

    <!-- ============================================================== -->
    <!-- MASSIVE CHROME SEMI-TRUCK RADIATOR GRILLE (The Signature Element) -->
    <!-- ============================================================== -->
    <!-- Outer Heavy Chrome Grille Housing -->
    <rect x="180" y="246" width="152" height="118" rx="8" 
          fill="#0B0E12" 
          stroke="url(#chromeGrad)" 
          stroke-width="9" />

    <!-- Inner High-Vis Orange Border Accent -->
    <rect x="186" y="252" width="140" height="106" rx="4" 
          fill="none" 
          stroke="#FF6B00" 
          stroke-width="2.5" />

    <!-- Bold Polished Vertical Grille Louvers -->
    <g stroke="url(#silverBright)" stroke-width="5.5" stroke-linecap="round">
      <line x1="202" y1="258" x2="202" y2="352" />
      <line x1="214" y1="258" x2="214" y2="352" />
      <line x1="226" y1="258" x2="226" y2="352" />
      <line x1="238" y1="258" x2="238" y2="352" />
      <line x1="250" y1="258" x2="250" y2="352" />
      
      <!-- Center Chrome Spine Bar -->
      <line x1="256" y1="254" x2="256" y2="356" stroke="#FF6B00" stroke-width="6" />

      <line x1="262" y1="258" x2="262" y2="352" />
      <line x1="274" y1="258" x2="274" y2="352" />
      <line x1="286" y1="258" x2="286" y2="352" />
      <line x1="298" y1="258" x2="298" y2="352" />
      <line x1="310" y1="258" x2="310" y2="352" />
    </g>

    <!-- Center Hood Emblem / Star Badge -->
    <polygon points="256,238 261,248 272,248 263,254 266,264 256,258 246,264 249,254 240,248 251,248" 
             fill="url(#hiVisOrange)" 
             stroke="#FFFFFF" 
             stroke-width="1"/>
  </g>

  <!-- HEAVY-DUTY COMMERCIAL STEEL DROP BUMPER & RECOVERY HOOKS -->
  <g filter="url(#truckShadow)">
    <!-- Steer Tires on Ground Behind Bumper -->
    <rect x="130" y="360" width="34" height="42" rx="6" fill="#14181F" stroke="#000000" stroke-width="2"/>
    <line x1="130" y1="375" x2="164" y2="375" stroke="#334155" stroke-width="2"/>
    <line x1="130" y1="390" x2="164" y2="390" stroke="#334155" stroke-width="2"/>

    <rect x="348" y="360" width="34" height="42" rx="6" fill="#14181F" stroke="#000000" stroke-width="2"/>
    <line x1="348" y1="375" x2="382" y2="375" stroke="#334155" stroke-width="2"/>
    <line x1="348" y1="390" x2="382" y2="390" stroke="#334155" stroke-width="2"/>

    <!-- Massive Chrome Drop Bumper -->
    <path d="M 126 360 L 386 360 L 380 395 L 290 405 L 222 405 L 132 395 Z" 
          fill="url(#chromeGrad)" 
          stroke="#475569" 
          stroke-width="3" />
    
    <!-- Bumper Cut-out Center Step / Heavy Steel Non-Slip Grip Tread -->
    <rect x="210" y="374" width="92" height="18" rx="3" fill="#0B0E12" stroke="#64748B" stroke-width="1.5"/>
    <g stroke="#FF6B00" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
      <line x1="222" y1="387" x2="230" y2="379" />
      <line x1="234" y1="387" x2="242" y2="379" />
      <line x1="246" y1="387" x2="254" y2="379" />
      <line x1="258" y1="387" x2="266" y2="379" />
      <line x1="270" y1="387" x2="278" y2="379" />
      <line x1="282" y1="387" x2="290" y2="379" />
    </g>

    <!-- Heavy Forged Steel Tow Hooks / Recovery Shackles -->
    <!-- Left Tow Hook -->
    <circle cx="178" cy="385" r="9" fill="none" stroke="#FF6B00" stroke-width="4.5" />
    <circle cx="178" cy="385" r="4" fill="#0D1117" />
    <!-- Right Tow Hook -->
    <circle cx="334" cy="385" r="9" fill="none" stroke="#FF6B00" stroke-width="4.5" />
    <circle cx="334" cy="385" r="4" fill="#0D1117" />
  </g>

  <!-- ============================================================== -->
  <!-- BOLD BRAND TEXT RIBBON AT BASE OF SHIELD -->
  <!-- ============================================================== -->
  <g filter="url(#truckShadow)">
    <path d="M 148 412 L 364 412 L 348 442 L 256 462 L 164 442 Z" 
          fill="#0E1218" 
          stroke="url(#hiVisOrange)" 
          stroke-width="3" />
    
    <text x="256" y="432" 
          font-family="'Barlow Condensed', system-ui, sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#FFFFFF">LINEHAUL</text>

    <text x="256" y="449" 
          font-family="'Chakra Petch', monospace" 
          font-size="11" 
          font-weight="900" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#FF6B00">STRONG</text>
  </g>
</svg>
